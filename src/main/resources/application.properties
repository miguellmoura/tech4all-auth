spring.application.name=tech4all

spring.datasource.url=jdbc:sqlserver://tech4all-sql-server.database.windows.net:1433;database=tech4all-sql
spring.datasource.username=admin123@tech4all-sql-server
spring.datasource.password=EXPPSI89*
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Criar/atualizar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Habilitar console web do H2
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Mostrar SQL no log
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Desabilitar configurações conflitantes com SQL Server
# (não deixar nem driver nem dialect do SQL Server ativos)

# Configura o contexto base da API
server.servlet.context-path=/api
server.port=8081
# Configura o Swagger (se usar)
springdoc.swagger-ui.use-root-path=true

# Controle de erros para debug
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
